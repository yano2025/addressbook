<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>印刷画面</title>
	<link rel="stylesheet" th:href="@{../css/print.css}" type="text/css" media="all">
	<style>
		/* 印刷とPDF出力の両方に適用するスタイル */
		#content {
			background-image: url('../image/hagaki_kansei.jpg');
			background-size: cover;
			background-repeat: no-repeat;
			width: 210mm; /* A4サイズの横幅 */
			height: 297mm; /* A4サイズの縦幅 */
			margin: 0 auto; /* 中央寄せ */
			position: relative;
			padding: 20px; /* コンテンツの余白調整 */
			box-sizing: border-box;
		}

		/* 印刷時に適用するスタイル */
		@media print {
			#content {
				background-image: none !important; /* 印刷時は背景を消す */
			}
			body {
				margin: 0;
			}
		}
	</style>
</head>
<body>
	<section class="top">
		<div>
			<button class="printbutton" onclick="myfun()">印刷</button>
			<script type="text/javascript">
				function myfun(){
					window.print();
				}
			</script>
		</div>
		
		<div>
		    <button class="printbutton" id="pdfButton">PDF出力</button>
		</div>
		
		<!-- html2pdfのCDNを読み込む -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.js"></script>
		
		<script>
		    document.querySelector("#pdfButton").addEventListener("click", () => {
		        const content = document.querySelector("#content");
		        const filename = "sample.pdf";
		        
		        const options = {
		            margin: 0,
		            filename: filename,
		            image: { type: 'jpeg', quality: 1.0 },
		            html2canvas: { scale: 2, backgroundColor: null },
		            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
		        };

		        html2pdf().from(content).set(options).save();
		    });
		</script>

		<form method="POST" th:action="@{/print}">
			<input class="backbutton" type="submit" value="一覧へもどる">				
		</form>
	</section>
	
	<!-- PDF出力対象のコンテンツ -->
	<div id="content">
		<div class="postno">
			<p th:text="${list.postno}"></p>
		</div>
		<section class="center">
			<ul>
				<li class="myname">
					<p th:text="${loginlist.myname}"></p>			
				</li>
				<li class="myaddress">
					<address th:text="${loginlist.myaddress}"></address>		
				</li>
				<li class="name">
					<p th:text="${list.name}+'　様'"></p>		
				</li>	
				<li class="address">
					<address th:text="${list.address}"></address>			
				</li>		
			</ul>
		</section>

		<section class="mypostno">
			<p th:text="${loginlist.mypostno}"></p>
		</section>
	</div>
</body>
</html>
